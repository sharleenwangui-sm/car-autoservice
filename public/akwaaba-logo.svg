<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7cb342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558b2f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3817;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gear -->
  <circle cx="120" cy="100" r="45" fill="none" stroke="#558b2f" stroke-width="3"/>
  <circle cx="120" cy="100" r="35" fill="none" stroke="#558b2f" stroke-width="2"/>
  
  <!-- Gear teeth -->
  <g stroke="#558b2f" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="50" x2="120" y2="35"/>
    <line x1="145" y1="60" x2="156" y2="49"/>
    <line x1="165" y1="80" x2="180" y2="65"/>
    <line x1="170" y1="105" x2="185" y2="105"/>
    <line x1="165" y1="130" x2="180" y2="145"/>
    <line x1="145" y1="150" x2="156" y2="161"/>
    <line x1="120" y1="160" x2="120" y2="175"/>
  </g>
  
  <!-- Wheel spokes -->
  <g stroke="#7cb342" stroke-width="2" opacity="0.6">
    <line x1="120" y1="70" x2="120" y2="130"/>
    <line x1="90" y1="85" x2="150" y2="115"/>
    <line x1="85" y1="115" x2="155" y2="85"/>
    <line x1="90" y1="145" x2="150" y2="115"/>
  </g>
  
  <!-- Car body - Main section -->
  <path d="M 80 200 Q 75 180 100 170 L 320 170 Q 345 180 340 200 L 330 220 Q 325 230 315 235 L 85 235 Q 75 230 80 220 Z" fill="url(#greenGrad)" stroke="#1b5e20" stroke-width="2"/>
  
  <!-- Car top/cabin -->
  <path d="M 140 170 L 160 140 Q 165 135 180 135 Q 195 135 200 140 L 220 170 Z" fill="#7cb342" stroke="#1b5e20" stroke-width="2"/>
  
  <!-- Car hood/front -->
  <path d="M 100 170 Q 95 160 120 150 Q 130 148 140 170 Z" fill="#9ccc65" stroke="#1b5e20" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Car trunk/back -->
  <path d="M 320 170 Q 345 160 360 165 Q 355 175 340 200 Z" fill="#9ccc65" stroke="#1b5e20" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Car windows -->
  <ellipse cx="170" cy="155" rx="12" ry="8" fill="#e3f2fd" opacity="0.7"/>
  <ellipse cx="210" cy="155" rx="12" ry="8" fill="#e3f2fd" opacity="0.7"/>
  
  <!-- Left wheel -->
  <circle cx="120" cy="240" r="18" fill="url(#darkGreen)" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="120" cy="240" r="12" fill="#f5f5f5"/>
  <circle cx="120" cy="240" r="8" fill="#1b5e20"/>
  <!-- Wheel spokes -->
  <g stroke="#1b5e20" stroke-width="1.5">
    <line x1="120" y1="228" x2="120" y2="252"/>
    <line x1="108" y1="240" x2="132" y2="240"/>
    <line x1="112" y1="230" x2="128" y2="250"/>
    <line x1="128" y1="230" x2="112" y2="250"/>
  </g>
  
  <!-- Right wheel -->
  <circle cx="290" cy="240" r="18" fill="url(#darkGreen)" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="290" cy="240" r="12" fill="#f5f5f5"/>
  <circle cx="290" cy="240" r="8" fill="#1b5e20"/>
  <!-- Wheel spokes -->
  <g stroke="#1b5e20" stroke-width="1.5">
    <line x1="290" y1="228" x2="290" y2="252"/>
    <line x1="278" y1="240" x2="302" y2="240"/>
    <line x1="282" y1="230" x2="298" y2="250"/>
    <line x1="298" y1="230" x2="282" y2="250"/>
  </g>
  
  <!-- Motion line (swoosh) -->
  <path d="M 50 150 Q 100 130 200 125 Q 280 122 360 140" fill="none" stroke="#7cb342" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Text: AKWAABA -->
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#1b5e20">
    AKWAABA
  </text>
  
  <!-- Text: AUTO -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#558b2f" letter-spacing="2">
    AUTO
  </text>
  
  <!-- Decorative leaves -->
  <g fill="#7cb342" opacity="0.7">
    <!-- Left leaf -->
    <path d="M 170 375 Q 165 385 170 395 Q 175 385 170 375" />
    <path d="M 165 380 L 168 390"/>
    
    <!-- Right leaf -->
    <path d="M 230 375 Q 235 385 230 395 Q 225 385 230 375" />
    <path d="M 235 380 L 232 390"/>
  </g>
</svg>